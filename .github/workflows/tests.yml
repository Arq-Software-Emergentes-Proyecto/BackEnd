name: Unit tests

# Pruebas unitarias de los componentes serverless y de IA (TS020). Corren en cada Pull Request y en main,
# antes de que "Deploy API to AWS" publique la API.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'BuildingFex.Api/**'
      - 'BuildingFex.Api.Tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore buildingfex-api.sln

      - name: Test
        run: >
          dotnet test buildingfex-api.sln --no-restore -c Release
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
