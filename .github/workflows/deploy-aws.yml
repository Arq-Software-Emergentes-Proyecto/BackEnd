name: Deploy API to AWS

# Despliega la API en AWS Lambda (template.yaml). Requiere en GitHub (Settings → Secrets and variables → Actions):
#   variable AWS_REGION, secreto AWS_DEPLOY_ROLE_ARN (rol con OIDC) y los secretos de la app (ver docs/DEPLOY-AWS.md).
on:
  push:
    branches: [main]
    paths:
      - 'BuildingFex.Api/**'
      - 'template.yaml'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  STACK_NAME: buildingfex-api
  FRONTEND_ORIGINS: ${{ vars.FRONTEND_ORIGINS || 'https://fronted-seven-opal.vercel.app' }}
  FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://fronted-seven-opal.vercel.app' }}
  ALARM_EMAIL: ${{ vars.ALARM_EMAIL || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Diagnóstico al lanzarlo a mano: qué identidad (sub/aud) manda GitHub a AWS. No imprime el token.
      - name: Show OIDC claims
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(t+"="*(-len(t)%4))); print(json.dumps({k:c.get(k) for k in ("sub","aud","repository","ref","repository_owner")}, indent=2))'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # URL de la API si el stack ya existe: el webhook de Mercado Pago apunta a ella.
      - name: Current API URL
        id: current
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text 2>/dev/null || true)
          [ "$url" = "None" ] && url=""
          echo "api_url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish BuildingFex.Api -c Release -r linux-arm64 --self-contained false
          -p:PublishReadyToRun=true -o .aws-publish

      # Los secretos van en appsettings.Local.json dentro del paquete (la organización de AWS bloquea SSM y las
      # variables de entorno de Lambda no alcanzan para el JSON de Firebase).
      - name: Write app settings
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_PUBLIC_KEY: ${{ secrets.MP_PUBLIC_KEY }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: >
          python3 .github/scripts/lambda_settings.py .aws-publish
          "${{ steps.current.outputs.api_url && format('{0}/api/v1/payments/webhook', steps.current.outputs.api_url) || '' }}"

      - name: Deploy stack
        run: >
          sam deploy --template-file template.yaml --stack-name "$STACK_NAME"
          --resolve-s3 --capabilities CAPABILITY_IAM
          --no-confirm-changeset --no-fail-on-empty-changeset
          --parameter-overrides "FrontendOrigins=$FRONTEND_ORIGINS" "FrontendBaseUrl=$FRONTEND_BASE_URL" "AlarmEmail=$ALARM_EMAIL"

      - name: Read stack outputs
        id: stack
        run: |
          set -euo pipefail
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "api_url=$(out ApiUrl)" >> "$GITHUB_OUTPUT"
          echo "jobs_function=$(out JobsFunctionName)" >> "$GITHUB_OUTPUT"

      # Primer despliegue: recién ahora se conoce la URL de la API; se vuelve a desplegar con el webhook.
      - name: Set Mercado Pago webhook (first deploy)
        if: steps.current.outputs.api_url == ''
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_PUBLIC_KEY: ${{ secrets.MP_PUBLIC_KEY }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          python3 .github/scripts/lambda_settings.py .aws-publish "${{ steps.stack.outputs.api_url }}/api/v1/payments/webhook"
          sam deploy --template-file template.yaml --stack-name "$STACK_NAME" \
            --resolve-s3 --capabilities CAPABILITY_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides "FrontendOrigins=$FRONTEND_ORIGINS" "FrontendBaseUrl=$FRONTEND_BASE_URL" "AlarmEmail=$ALARM_EMAIL"

      - name: Migrate database
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "${{ steps.stack.outputs.jobs_function }}" \
            --payload '{"job":"migrate"}' --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 900 --query FunctionError --output text migrate.json > error.txt
          cat migrate.json; echo
          if [ "$(cat error.txt)" != "None" ]; then echo "::error::La migración falló (ver respuesta arriba y CloudWatch)"; exit 1; fi

      - name: Health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ steps.stack.outputs.api_url }}/health"; then echo; break; fi
            [ "$i" = 5 ] && exit 1
            sleep 5
          done
          echo "### API desplegada: ${{ steps.stack.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
