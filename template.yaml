AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  BuildingFex - API ASP.NET Core y funcion de jobs programados (EventBridge Scheduler) en Lambda detras de
  API Gateway (HTTP API). Base de datos en TiDB Cloud y secretos en appsettings.Local.json dentro del paquete
  (lo escribe .github/workflows/deploy-aws.yml desde los secretos de GitHub).

Parameters:
  FrontendOrigins:
    Type: String
    Default: https://fronted-seven-opal.vercel.app
    Description: Orígenes CORS permitidos, separados por coma.
  FrontendBaseUrl:
    Type: String
    Default: https://fronted-seven-opal.vercel.app
    Description: URL del front para las vueltas de Mercado Pago.
  FirebaseProjectId:
    Type: String
    Default: emergentes-36306
    Description: Proyecto de Firebase (autenticación).
  FirebaseStorageBucket:
    Type: String
    Default: emergentes-36306.firebasestorage.app
    Description: Bucket de Firebase Storage.
  ScheduleTimezone:
    Type: String
    Default: America/Lima
    Description: Zona horaria para las expresiones cron de EventBridge Scheduler.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Correo que recibe las alarmas; vacío = sin suscripción, se ven en la consola.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: dotnet10
    Architectures: [arm64]
    # Salida de: dotnet publish BuildingFex.Api -c Release -r linux-arm64 --self-contained false -o .aws-publish
    CodeUri: .aws-publish/
    Handler: BuildingFex.Api
    MemorySize: 1024
    # Trazas de X-Ray (TS019).
    Tracing: Active
    Environment:
      Variables:
        ASPNETCORE_ENVIRONMENT: Production
        Firebase__ProjectId: !Ref FirebaseProjectId
        FirebaseStorage__Bucket: !Ref FirebaseStorageBucket
        Cors__AllowedOrigins: !Ref FrontendOrigins
        MercadoPago__FrontendBaseUrl: !Ref FrontendBaseUrl
        BF_FILES_BUCKET: !Ref FilesBucket

Resources:
  # Documentos del condominio (Importación / contexto IA), privado, URLs de 15 min.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [',', !Ref FrontendOrigins]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BuildingFex API (ASP.NET Core)
      Timeout: 30
      Environment:
        Variables:
          BF_LAMBDA_ROLE: api
          BF_JOBS_FUNCTION_NAME: !Ref JobsFunction
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
        - LambdaInvokePolicy:
            FunctionName: !Ref JobsFunction
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FailedJobsQueue.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # Cola de fallos (TS019): invocaciones asíncronas y programaciones que no se pudieron completar.
  FailedJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # EventBridge Scheduler deja aquí sus fallos.
  FailedJobsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref FailedJobsQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSchedulerDeadLetters
            Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FailedJobsQueue.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BuildingFex alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: La API tuvo 5 o más errores en 5 minutos.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda rechazó invocaciones de la API por límite de concurrencia.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway devolvió 10 o más respuestas 5xx en 5 minutos.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FailedJobsQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Hay mensajes en la cola de fallos.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FailedJobsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BuildingFex jobs (migrate, monthly-billing, import-cleanup, ai-index)
      Timeout: 600
      Environment:
        Variables:
          BF_LAMBDA_ROLE: jobs
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
      EventInvokeConfig:
        MaximumRetryAttempts: 1
      Events:
        MonthlyBilling:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(15 6 * * ? *)"
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            Input: '{"job":"monthly-billing"}'
        ImportCleanup:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(30 minutes)"
            Input: '{"job":"import-cleanup"}'
        AiIndexSweep:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "rate(30 minutes)"
            Input: '{"job":"ai-index"}'

  JobsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${JobsFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL pública de la API; va en el rewrite de Vercel / VITE_API_BASE_URL.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiFunctionName:
    Description: Nombre de la función Lambda de la API.
    Value: !Ref ApiFunction
  JobsFunctionName:
    Description: Nombre de la función Lambda de jobs.
    Value: !Ref JobsFunction
  FailedJobsQueueUrl:
    Description: URL de la cola de fallos.
    Value: !Ref FailedJobsQueue
  AlarmTopicArn:
    Description: Tema SNS de las alarmas.
    Value: !Ref AlarmTopic
  FilesBucketName:
    Description: Nombre del bucket S3 privado para documentos.
    Value: !Ref FilesBucket
