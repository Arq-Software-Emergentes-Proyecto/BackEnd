AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BuildingFex API serverless: ASP.NET Core en AWS Lambda detrás de API Gateway (HTTP API) y una función de
  jobs programados (EventBridge Scheduler). Base de datos en TiDB Cloud. Los secretos van en
  appsettings.Local.json dentro del paquete (lo escribe .github/workflows/deploy-aws.yml desde GitHub).

Parameters:
  FrontendOrigins:
    Type: String
    Default: https://fronted-seven-opal.vercel.app
    Description: Orígenes permitidos por CORS, separados por coma.
  FrontendBaseUrl:
    Type: String
    Default: https://fronted-seven-opal.vercel.app
    Description: URL del front para las vueltas de Mercado Pago.
  FirebaseProjectId:
    Type: String
    Default: emergentes-36306
  FirebaseStorageBucket:
    Type: String
    Default: emergentes-36306.firebasestorage.app
  ScheduleTimezone:
    Type: String
    Default: America/Lima
  AlarmEmail:
    Type: String
    Default: ''
    Description: Correo que recibe las alarmas de CloudWatch (vacío = sin suscripción; se ven en la consola).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Runtime: dotnet10
    Architectures: [arm64]
    # Salida de `dotnet publish` (la genera el workflow antes de `sam deploy`).
    CodeUri: .aws-publish/
    Handler: BuildingFex.Api
    MemorySize: 1024
    # Trazas de X-Ray para ApiFunction y JobsFunction (TS019).
    Tracing: Active
    Environment:
      Variables:
        ASPNETCORE_ENVIRONMENT: Production
        Firebase__ProjectId: !Ref FirebaseProjectId
        FirebaseStorage__Bucket: !Ref FirebaseStorageBucket
        Cors__AllowedOrigins: !Ref FrontendOrigins
        MercadoPago__FrontendBaseUrl: !Ref FrontendBaseUrl
        BF_FILES_BUCKET: !Ref FilesBucket

Resources:
  # Documentos del condominio (Importación / contexto IA). Privado: el navegador sube y descarga con
  # URLs prefirmadas de 15 min que firma la API.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [',', !Ref FrontendOrigins]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BuildingFex API (ASP.NET Core)
      Timeout: 30
      Environment:
        Variables:
          BF_LAMBDA_ROLE: api
          BF_JOBS_FUNCTION_NAME: !Ref JobsFunction
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt FailedJobsQueue.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref JobsFunction
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: BuildingFex jobs (migrate, monthly-billing, import-cleanup, ai-index)
      Timeout: 600
      Environment:
        Variables:
          BF_LAMBDA_ROLE: jobs
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        # Invocaciones asíncronas que fallan tras el reintento (p. ej. indexación de un documento).
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedJobsQueue.Arn
      Events:
        MonthlyBilling:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(15 6 * * ? *)
            ScheduleExpressionTimezone: !Ref ScheduleTimezone
            Input: '{"job":"monthly-billing"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Arn: !GetAtt FailedJobsQueue.Arn
        ImportCleanup:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(30 minutes)
            Input: '{"job":"import-cleanup"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Arn: !GetAtt FailedJobsQueue.Arn
        AiIndexSweep:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(30 minutes)
            Input: '{"job":"ai-index"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Arn: !GetAtt FailedJobsQueue.Arn
        IncidentEscalation:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 hour)
            Input: '{"job":"incident-escalation"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Arn: !GetAtt FailedJobsQueue.Arn

  # Cola de fallos (TS019): invocaciones asíncronas y programaciones de EventBridge que no se pudieron completar.
  FailedJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  FailedJobsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref FailedJobsQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSchedulerDeadLetters
            Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FailedJobsQueue.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: BuildingFex alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ApiFunction devuelve errores (excepciones no controladas o timeouts).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ApiFunction está siendo limitada por concurrencia.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway responde 5xx.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  JobsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Falló un job programado o asíncrono de JobsFunction.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref JobsFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FailedJobsQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Hay mensajes en la cola de fallos; revisar y reprocesar.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FailedJobsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  JobsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${JobsFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: URL base de la API (va en el rewrite de Vercel / VITE_API_BASE_URL).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiFunctionName:
    Value: !Ref ApiFunction
  JobsFunctionName:
    Value: !Ref JobsFunction
  FilesBucketName:
    Value: !Ref FilesBucket
  FailedJobsQueueUrl:
    Value: !Ref FailedJobsQueue
  AlarmTopicArn:
    Value: !Ref AlarmTopic
